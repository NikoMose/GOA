<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>padding</title>
  <style>
    body {
      background-color: #f2f2f2;
    }

    p {
      background-color: white;
      padding: 100px;
      text-align: center;
      width: 300px;
      margin: 100px auto;
      border: 2px solid black;
    }
  </style>
</head>
<body>
  <p>paragraph with centred padding</p>
</body>
</html>
