<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Product Preview Card</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="card-image"><img src="./images/icon-cart.svg"></div>

    <div class="card-content">
      <p class="category">P E R F U M E</p>

      <h1 class="title">
        Gabrielle Essence<br>
        Eau De Parfum
      </h1>

      <p class="description">
        A floral, solar and voluptuous interpretation composed by<br>
        Olivier Polge, Perfumer-Creator for the House of CHANEL.
      </p>

      <div class="pricebox">
        <span class="new">$149.99</span>
        <span class="old">$169.99</span>
      </div>

      <button class="addbutton">Add to Cart</button>
    </div>
  </div>

</body>
</html>
