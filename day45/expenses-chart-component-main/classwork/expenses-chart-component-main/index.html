<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expenses Chart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- MAIN CONTAINER -->
  <div class="container">

    <!-- BALANCE CARD -->
    <div class="firstdiv">
      <div>
        <h6 class="six">My balance</h6>
        <h2 class="four">$921.48</h2>
      </div>
      <img src="./images/logo.svg" alt="logo">
    </div>

    <!-- CHART CARD -->
    <div class="seconddiv">
      <h4 class="lastsevenday">Spending - Last 7 days</h4>

      <div class="huu">
        <div class="a"><div class="divmon"></div><h6>mon</h6></div>
        <div class="a"><div class="divtue"></div><h6>tue</h6></div>
        <div class="a"><div class="divwed"></div><h6>wed</h6></div>
        <div class="a"><div class="divthu"></div><h6>thu</h6></div>
        <div class="a"><div class="divfri"></div><h6>fri</h6></div>
        <div class="a"><div class="divsat"></div><h6>sat</h6></div>
        <div class="a"><div class="divsun"></div><h6>sun</h6></div>
      </div>

      <hr>

      <div class="bottom">
        <div>
          <h5 class="Total">Total this month</h5>
          <h2>$478.33</h2>
        </div>

        <div class="right">
          <h5 class="precent">+2.4%</h5>
          <h6>from last month</h6>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
