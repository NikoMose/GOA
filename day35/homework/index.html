<!DOCTYPE html>
<html>
<head>
<title>html table design</title>
<style>
  body {
    text-align: center;
    background-color: white;
  }

  h1 {
    color: red;
    font-size: 60px;
    font-weight: bold;
  }

  h2 {
    font-size: 24px;
    margin-top: -10px;
  }

  table {
    border: 3px solid orange;
    margin: 20px auto;
  }

  th, td {
    border: 2px solid orange;
    padding: 8px 15px;
    text-align: center;
  }

  th {
    background-color: yellow;
  }

  tr:nth-child(even) {
    background-color: #fff;
  }

  tr:nth-child(odd) {
    background-color: #fff;
  }

  td {
    background-color: #fff;
  }
</style>
</head>
<body>

<h1>html table design</h1>

<table>
  <tr>
    <th>Sr.No</th>
    <th>Name</th>
    <th>Address</th>
    <th>City</th>
    <th>Pincode</th>
    <th>Mobile No</th>
  </tr>

</body>
</html>
