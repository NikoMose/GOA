<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: darkgreen;
    text-align: center;
    color: white;
  }

  h1 {
    font-size: 50px;
    font-weight: bold;
    margin-top: 60px;
  }

  h1 span {
    color: red;
  }

  table {
    width: 80%;
    border-collapse: collapse;
    margin: 40px auto;
  }

  th, td {
    border: 1px solid black;
    padding: 10px;
    text-align: center;
    font-size: 18px;
  }

  th {
    background-color: #a7d3e7;
    color: black;
  }

  tr:nth-child(2) { background-color: #b6ff4d; }
  tr:nth-child(3) { background-color: #b6ff4d; }
  tr:nth-child(4) { background-color: #b6ff4d; }
  tr:nth-child(5) { background-color: #b6ff4d; }
  tr:nth-child(6) { background-color: #b6ff4d; }

  td:nth-child(4) {
    background-color: #b44a1d;
    color: white;
  }

  td:nth-child(5) {
    background-color: #a80e0e;
    color: white;
  }

  td:nth-child(1) {
    background-color: #9efc3f;
    font-weight: bold;
  }

</style>
</head>
<body>

<h1>make simple table in html</h1>

<table>
  <tr>
    <th>S.R</th>
    <th>Name</th>
    <th>Address</th>
    <th>Number</th>
    <th>Country</th>
  </tr>
  <tr>
    <td>1</td>
    <td>John</td>
    <td>California</td>
    <td>745845</td>
    <td>USA</td>
  </tr>
  <tr>
    <td>2</td>
    <td>Dain</td>
    <td>Barlin</td>
    <td>514254</td>
    <td>Germany</td>
  </tr>
  <tr>
    <td>3</td>
    <td>Que</td>
    <td>New Delhi</td>
    <td>854874</td>
    <td>India</td>
  </tr>
  <tr>
    <td>4</td>
    <td>Tesla</td>
    <td>Karanchi</td>
    <td>658243</td>
    <td>Pakistan</td>
  </tr>
  <tr>
    <td>5</td>
    <td>Neil</td>
    <td>Dhaka</td>
    <td>658489</td>
    <td>Bangladesh</td>
  </tr>
</table>

</body>
</html>
