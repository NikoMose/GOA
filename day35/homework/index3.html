<!DOCTYPE html>
<html>
<head>
<title>make html table</title>
<style>
  body {
    text-align: center;
    background-color: white;
  }

  h1 {
    background-color: yellow;
    color: black;
    padding: 15px 0;
    margin: 0;
    font-size: 40px;
    font-weight: bold;
    border: 2px solid orange;
  }

  table {
    width: 80%;
    border-collapse: collapse;
    margin: 40px auto;
    font-size: 18px;
    border: 2px solid yellow;
  }

  th, td {
    border: 2px solid yellow;
    padding: 12px;
    text-align: center;
  }

  th {
    background-color: red;
    color: white;
  }

  td {
    background-color: #9acd32;
    color: black;
    font-weight: bold;
  }

  h2 {
    color: red;
    font-size: 40px;
    margin-top: 40px;
  }
</style>
</head>
<body>

<h1>make html table</h1>

<table>
  <tr>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Position</th>
    <th>Salary</th>
  </tr>
  <tr>
    <td>James</td>
    <td>Jeo</td>
    <td>CEO</td>
    <td>$1300</td>
  </tr>
  <tr>
    <td>Kate</td>
    <td>Harns</td>
    <td>Designer</td>
    <td>$1000</td>
  </tr>
  <tr>
    <td>Bryan</td>
    <td>Brian</td>
    <td>Team Leader</td>
    <td>$700</td>
  </tr>
  <tr>
    <td>Lesely</td>
    <td>Prcnic</td>
    <td>Author</td>
    <td>$500</td>
  </tr>
</table>

</body>
</html>
