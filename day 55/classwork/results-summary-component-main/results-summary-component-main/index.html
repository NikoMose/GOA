<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Results summary component</title>
</head>

<body>
  <div class="aaa">
    <div class="one">
      <h3>Your Result</h3>
      <div class="result">
        <h1>76</h1>
        <h4>of 100</h4>
      </div>

      <h1>Great</h1>

      <p>You scored higher than 65% of<br>
        the people who have taken<br>
        these tests.</p>
    </div>

    <div class="two">

      <h2>Summary</h2>
      <div class="reaction">
        <div class="reaction2">
          <img src="assets/images/icon-reaction.svg">
          <p>Reaction</p>
        </div>
        <div>
          <p>80 <span>/100</span></p>
        </div>

      </div>
      <div class="memory">
        <div class="memory2">
          <img src="assets/images/icon-memory.svg">
          <p>Memory</p>
        </div>
        <div>

          <p>92 <span>/100</span></p>
        </div>

      </div>

      <div class="verbal">
        <div class="verbal2">
          <img src="assets/images/icon-verbal.svg">
          <p>Verbal</p>
        </div>
        <div>
          <p>61 <span>/100</span></p>
        </div>

      </div>

      <div class="visual">
        <div class="visual2">
          <img src="assets/images/icon-visual.svg">
          <p>Visual</p>
        </div>
        <div>
          <p>73 <span>/100</span></p>
        </div>

      </div>

      <button>Continue</button>

    </div>
  </div>

</body>

</html>
